[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cogni-study-pro"
version = "3.0.0"
description = "Enterprise Multi-Modal RAG Knowledge Platform & Autonomous Study Agent"
authors = [{ name = "CogniStudy AI Team" }]
readme = "README.md"
requires-python = ">=3.9"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
